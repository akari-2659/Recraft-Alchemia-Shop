name: RA v733 facility common DB compatibility

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ra-v733-facility-common-db-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch facility
        run: python .github/ra-v733-facility-patch.py
      - name: Commit facility
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add facility.html
          git diff --cached --quiet && exit 0
          git commit -m "Allow compatible common DB versions in facility v90.8.733"
          git push

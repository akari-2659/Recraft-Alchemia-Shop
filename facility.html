<body class="ra-app ra-player ra-facility">

function facilityPerformance(item){

function facilityGithubDelay(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
function facilityValidateGithubMaster(masterDocument,manifest={}){
  const data=masterDocument&&masterDocument.data&&typeof masterDocument.data==='object'?masterDocument.data:masterDocument;
  if(!Array.isArray(data.items)||!Array.isArray(data.recipes)||!Array.isArray(data.exploration_areas)){

    manifest,document:masterDocument,data,version:masterVersion||manifestVersion,
    versionWarning:manifestVersion&&masterVersion&&manifestVersion!==masterVersion
      ?`manifest ${manifestVersion} / master ${masterVersion}`:''
  };
}
async function facilityFetchGithubJson(url){
  const response=await fetch(url,{cache:'no-store'});
  if(!response.ok)throw new Error(`HTTP ${response.status}`);
  return response.json();
}
async function fetchGithubCommonMaster({force=false}={}){
  if(commonMasterPromise&&!force)return commonMasterPromise;
  const task=(async()=>{
    let lastError=null;
    let usableMismatch=null;
    for(let attempt=0;attempt<4;attempt++){
      const token=`${Date.now()}_${attempt}_${Math.random().toString(36).slice(2)}`;
      try{
        const manifestUrl=new URL(GITHUB_COMMON_DB_MANIFEST_URL);
        manifestUrl.searchParams.set('_ra',token);
        const manifest=await facilityFetchGithubJson(manifestUrl.toString());
        const masterFile=String(manifest.master||'').trim();
        if(!masterFile||masterFile.includes('..')||masterFile.includes('\\'))throw new Error('共通DBのmasterファイル名が不正です。');
        const masterUrl=new URL(masterFile,GITHUB_COMMON_DB_BASE);
        masterUrl.searchParams.set('_ra',`${String(manifest.sha256||manifest.version||'master')}_${token}`);
        const masterDocument=await facilityFetchGithubJson(masterUrl.toString());
        const result=facilityValidateGithubMaster(masterDocument,manifest);
        if(!result.versionWarning)return result;
        usableMismatch=result;
        lastError=new Error(`共通DBの更新反映待ちです（${result.versionWarning}）。`);
      }catch(error){
        lastError=error;
      }
      if(attempt<3)await facilityGithubDelay(350*(attempt+1));
    }
    // GitHub Pagesのmanifestだけが一時的に古い／取得不能でも、固定名のmaster本体が正常ならGASへ落とさない。
    try{
      const directUrl=new URL('recraft_alchemia_master.json',GITHUB_COMMON_DB_BASE);
      directUrl.searchParams.set('_ra',`${Date.now()}_direct_${Math.random().toString(36).slice(2)}`);
      const masterDocument=await facilityFetchGithubJson(directUrl.toString());
      return facilityValidateGithubMaster(masterDocument,{master:'recraft_alchemia_master.json'});
    }catch(directError){
      if(usableMismatch)return usableMismatch;
      throw new Error([lastError&&lastError.message,directError&&directError.message].filter(Boolean).join(' / ')||'GitHub共通DBを取得できませんでした。');
    }
  })();
  commonMasterPromise=task;
  try{return await task;}
  catch(error){
    if(commonMasterPromise===task)commonMasterPromise=null;
    throw error;
  }
}
function buildFacilityCatalogFromGithub(commonMaster,unlockState){
  const data=commonMaster.data||{};
  const areas=(Array.isArray(data.exploration_areas)?data.exploration_areas:[])
    .filter(facilityEnabled)
    .sort((a,b)=>{
      const ao=Number(a.unlockOrder),bo=Number(b.unlockOrder);
      if(Number.isFinite(ao)&&Number.isFinite(bo)&&ao!==bo)return ao-bo;
      if(Number.isFinite(ao)!==Number.isFinite(bo))return Number.isFinite(ao)?-1:1;

    });

  const currentArea=areas.find(a=>String(a.id||'')===String(stateArea.id||''))
    ||areas.find(a=>String(a.unlockKey||'')===String(unlockState&&unlockState.unlockKey||''))
    ||(!String(unlockState&&unlockState.unlockKey||'').trim()?areas[0]:null);
  if(!currentArea)throw new Error('GASの解放状態と共通DBの探索エリアが一致しません。');
  const currentOrder=Number(currentArea.unlockOrder)||1;
  const areaById={};
  areas.forEach(a=>{areaById[String(a.id||'')]=a;});
  function requiredOrder(row){
    const explicit=Number(row&&row.unlockOrder);
    if(Number.isFinite(explicit)&&explicit>0)return explicit;
    const areaId=String(row&&row.unlockAreaKey||'').trim();
    if(!areaId)return Number(areas[0].unlockOrder)||1;
    const area=areaById[areaId];
    return area?Number(area.unlockOrder)||1:Infinity;
  }
  function unlocked(row){
    return requiredOrder(row)<=currentOrder;
  }
  function facilityMatch(row,facilityName){return facilityText(row).includes(facilityName);}
  function isRandomUnidentifiedScroll(row){
    return String(row&&row.itemCategory||'').includes('未鑑定')||String(row&&row.tags||'').includes('ランダム販売');
  }
  function isSkillCrystalItem(row){
    const text=[row&&row.name,row&&row.itemCategory,row&&row.tags,row&&row.source].map(v=>String(v||'')).join(' ');
    return text.includes('スキルクリスタル');
  }
  function unidentifiedScrollType(row){
    const text=[row&&row.name,row&&row.itemCategory,row&&row.tags].map(v=>String(v||'')).join(' ');
    if(text.includes('祈祷'))return '祈祷';
    if(text.includes('魔法'))return '魔法';
    return '術式';
  }
  function maxAntiqueScrollRank(){

    if(currentOrder<2)return 0;
    if(currentOrder<3)return 1;
    if(currentOrder<4)return 2;
    return 3;
  }

    const ao=requiredOrder(a),bo=requiredOrder(b);
    if(ao!==bo)return ao-bo;
    const ar=Number(a.rank)||1,br=Number(b.rank)||1;
    if(ar!==br)return ar-br;
    return String(a.resultItem||a.name||'').localeCompare(String(b.resultItem||b.name||''),'ja');
  }

  const items=(Array.isArray(data.items)?data.items:[]).filter(facilityEnabled);
  const recipes=(Array.isArray(data.recipes)?data.recipes:[]).filter(facilityEnabled);
  const processedMaterialResults=new Set(recipes.filter(r=>String(r.craftType||'').trim()==='素材加工').map(r=>String(r.resultItem||r.name||'').trim()).filter(Boolean));
  const branchResultNames={};
  const branchByResult={};
  recipes.forEach(r=>{
    if(String(r.craftType||'')==='武器派生'){
      const resultName=String(r.resultItem||'');
      if(resultName){branchResultNames[resultName]=true;branchByResult[resultName]=r;}
    }
  });
  function sales(facilityName){
    const saleItems=items.filter(r=>{
      if(!String(r.name||'').trim()||!facilityMatch(r,facilityName)||!unlocked(r))return false;
      if(facilityName==='鍛冶屋'&&branchResultNames[String(r.name||'')])return false;
      if(processedMaterialResults.has(String(r.name||'').trim()))return false;
      if(facilityName==='骨董屋'&&(isRandomUnidentifiedScroll(r)||isSkillCrystalItem(r)))return false;
      return true;
    }).sort(sortRows).map(facilitySafeItem);
    const saleRecipes=recipes.filter(r=>{
      const price=Number(String(r.recipePrice||'').trim());
      return String(r.craftType||'').trim()!=='素材加工'&&String(r.recipeSource||'').includes(facilityName)&&Number.isFinite(price)&&price>0&&unlocked(r);
    }).sort(sortRows).map(facilitySafeShopRecipe);
    return saleItems.concat(saleRecipes);

  function antiqueScrollPrices(){
    const maxRank=maxAntiqueScrollRank();
    const grouped={};

function branchTableOrder(branches){

  }));
  branches.forEach((branch,index)=>{
    const nodes=branchFlatNodes(branch);
    const same=new Set(nodes.map(n=>String(n.actualResultItem||n.resultItem||'').trim()).filter(Boolean));
    const roots=nodes.filter(n=>!same.has(String(n.baseItem||'').trim()));

    const parentInfo=root?nodeByName[String(root.baseItem||'').trim()]:null;

}

function branchGraphCatalog(current){
  const branches=current.matched||[];
  const ordered=branchTableOrder(branches);
  const baseWeapons=current.baseWeapons||[];
  const allNodes=ordered.flatMap(meta=>branchFlatNodes(meta.branch));
  if(!baseWeapons.length&&!allNodes.length)return '<div class="empty">検索・★ランク条件に一致する武器派生はありません。</div>';
  const ranks=[...baseWeapons.map(w=>rankValue(w.rank)),...allNodes.map(n=>rankValue(n.rank))];
  const minRank=Math.min(...ranks,1),maxRank=Math.max(...ranks,1);
  const rankSlots=new Map();for(let r=minRank;r<=maxRank;r++)rankSlots.set(r,1);
  const placements=[];
  function placeRow(entries,row){
    const countByRank=new Map();
    entries.slice().sort((a,b)=>Number(a.depth)-Number(b.depth)||Number(a.branchNodeIndex)-Number(b.branchNodeIndex)||Number(a.unlockOrder)-Number(b.unlockOrder)).forEach(entry=>{
      const rank=rankValue(entry.rank),slot=(countByRank.get(rank)||0)+1;countByRank.set(rank,slot);
      rankSlots.set(rank,Math.max(rankSlots.get(rank)||1,slot));placements.push({entry,row,rank,slot});
    });
  }
  placeRow(baseWeapons,2);
  ordered.forEach((meta,index)=>placeRow(branchFlatNodes(meta.branch),index+3));
  const rankStart=new Map();let cursor=2;
  for(let r=minRank;r<=maxRank;r++){rankStart.set(r,cursor);cursor+=rankSlots.get(r)||1;}
  const totalNodeCols=cursor-2,totalRows=ordered.length+1;
  const style=`grid-template-columns:var(--branch-label-width) repeat(${totalNodeCols},174px);grid-template-rows:36px repeat(${totalRows},minmax(66px,auto))`;
  const bands=[];const headers=[];
  for(let r=minRank;r<=maxRank;r++){
    const start=rankStart.get(r),span=rankSlots.get(r)||1;
    bands.push(`<div class="branch-rank-band" style="grid-column:${start}/span ${span};grid-row:2/${totalRows+2}"></div>`);
    headers.push(`<div class="branch-graph-rank" style="grid-column:${start}/span ${span};grid-row:1">${esc(rankLabel(r))}</div>`);
  }
  const labels=[`<div class="branch-graph-label base" style="grid-column:1;grid-row:2">基礎武器</div>`];
  ordered.forEach((meta,index)=>labels.push(`<div class="branch-graph-label" style="grid-column:1;grid-row:${index+3}">${esc(meta.branch.label||'？？？')}派生</div>`));
  const nodes=placements.map(p=>graphNodeHtml(p.entry,p.row,(rankStart.get(p.rank)||2)+p.slot-1,{base:p.row===2})).join('');
  return `<div class="branch-graph-scroll"><div class="branch-graph-canvas" style="${style}">${bands.join('')}${headers.join('')}${labels.join('')}<svg class="branch-graph-svg" aria-hidden="true"></svg>${nodes}</div></div>`;
}

  childrenByParent.forEach(({parent,children})=>{
    const pr=parent.getBoundingClientRect();
    const sx=pr.right-canvasRect.left,sy=pr.top-canvasRect.top+pr.height/2;
    const points=children.map(child=>{
      const cr=child.getBoundingClientRect();
      const ex=cr.left-canvasRect.left;
      return{ex,ey:cr.top-canvasRect.top+cr.height/2,endX:ex-nodeGap};
    }).sort((a,b)=>Math.abs(a.ey-sy)-Math.abs(b.ey-sy)||a.endX-b.endX||a.ey-b.ey);
    if(points.length===1){
      const {ey,endX}=points[0];
      const bendX=Math.max(sx+parentStub,Math.min(endX-arrowClearance,sx+46));
      const safeBendX=Math.min(bendX,endX-18);
      const d=Math.abs(ey-sy)<1
        ?`M ${sx} ${sy} H ${endX}`
        :`M ${sx} ${sy} H ${safeBendX} V ${ey} H ${endX}`;
      paths.push(`<path class="branch-graph-edge" d="${d}" marker-end="url(#branchArrow)"></path>`);
      return;
    }
    // 親と同じ高さに最も近い派生先を主線とし、その矢印より十分手前で全枝を分岐させる。
    const primary=points[0];
    const earliestEndX=Math.min(...points.map(p=>p.endX));
    const preferredBranchX=Math.min(primary.endX-arrowClearance,earliestEndX-arrowClearance);
    const latestBranchX=earliestEndX-30;
    const branchX=Math.min(latestBranchX,Math.max(sx+parentStub,preferredBranchX));
    const ys=[sy,...points.map(p=>p.ey)],minY=Math.min(...ys),maxY=Math.max(...ys);
    // 幹線は1本だけ。矢印そのものを分岐点にせず、矢印の38px以上手前に縦幹線を置く。
    paths.push(`<path class="branch-graph-edge branch-graph-trunk" d="M ${sx} ${sy} H ${branchX}${maxY>minY?` M ${branchX} ${minY} V ${maxY}`:''}"></path>`);
    points.forEach(({endX,ey})=>{
      paths.push(`<path class="branch-graph-edge branch-graph-branch" d="M ${branchX} ${ey} H ${endX}" marker-end="url(#branchArrow)"></path>`);
    });
  });
  svg.innerHTML=`<defs><marker id="branchArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a7652"></path></marker></defs>${paths.join('')}`;
}
function scheduleBranchConnections(){cancelAnimationFrame(branchGraphFrame);branchGraphFrame=requestAnimationFrame(()=>requestAnimationFrame(drawBranchConnections));}
function modalLinkHtml(entry,label){

  const next=Array.isArray(entry.nextBranches)?entry.nextBranches:[];
  const nextHtml=next.length?`<section class="weapon-modal-links"><h4>次の派生先</h4>${next.map(child=>modalLinkHtml(child,'詳細を見る')).join('')}</section>`:'';
  return `<div class="chips">${chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>${entry.performance&&entry.performance.length?`<div class="weapon-modal-performance">${performanceHtml(entry.performance)}</div>`:''}<dl class="weapon-modal-details">${pairs.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>${parentHtml}${nextHtml}`;

function openWeaponModal(name,trigger=null){

  const modal=$('weaponDetailModal');if(!weaponModalLastFocus&&trigger)weaponModalLastFocus=trigger;$('weaponModalTitle').textContent=`${entry.actualResultItem||entry.name||entry.resultItem||'武器詳細'}　${rankLabel(entry.rank)}`;$('weaponModalBody').innerHTML=weaponModalHtml(entry);modal.hidden=false;modal.setAttribute('aria-hidden','false');requestAnimationFrame(()=>modal.querySelector('[data-close-weapon-modal]')?.focus());
}
function closeWeaponModal(){const modal=$('weaponDetailModal');if(modal.hidden)return;modal.hidden=true;modal.setAttribute('aria-hidden','true');const focus=weaponModalLastFocus;weaponModalLastFocus=null;if(focus&&document.contains(focus))focus.focus();}
function branchCatalog(categories){
  const select=$('weaponCategorySelect');
  if(!categories.length){select.innerHTML='';branchDetailIndex=Object.create(null);return '<div class="empty">武器派生は登録されていません。</div>';}
  const query=searchNorm(branchSearch);
  const available=categories.map(cat=>{
    const baseQueryMatch=!query||(cat.baseWeapons||[]).some(w=>searchNorm([w.name,w.itemCategory,w.description,w.effect].filter(Boolean).join(' ')).includes(query));
    const baseWeapons=(cat.baseWeapons||[]).filter(rankMatches).filter(w=>!query||baseQueryMatch||searchNorm([w.name,w.itemCategory,w.description,w.effect].filter(Boolean).join(' ')).includes(query));
    const matched=(cat.branches||[]).filter(branch=>baseQueryMatch||branchMatches(branch,query)).map(branch=>{
      const lines=(branch.lines||[]).map(line=>({...line,nodes:(line.nodes||[]).filter(rankMatches)})).filter(line=>line.nodes.length);return {...branch,lines};
    }).filter(branch=>branch.lines.length);
    const count=baseWeapons.length+matched.reduce((sum,branch)=>sum+branchNodeCount(branch),0);
    return {...cat,source:cat,baseWeapons,matched,count};
  }).filter(cat=>cat.count>0);
  if(!available.length){select.innerHTML='';branchDetailIndex=Object.create(null);return '<div class="empty">検索・★ランク条件に一致する武器派生はありません。</div>';}
  if(!available.some(cat=>cat.category===currentWeaponCategory))currentWeaponCategory=available[0].category;
  localStorage.setItem(WEAPON_CATEGORY_STORAGE_KEY,currentWeaponCategory);
  select.innerHTML=available.map(cat=>`<option value="${esc(cat.category)}" ${cat.category===currentWeaponCategory?'selected':''}>${esc(cat.category)}（${cat.count}）</option>`).join('');
  const current=available.find(cat=>cat.category===currentWeaponCategory)||available[0];rebuildBranchDetailIndex(current.source||current);return branchGraphCatalog(current);
}

function catalogRowMatches(row){const q=searchNorm(catalogSearch);if(!q)return true;return searchNorm(Object.values(row||{}).filter(v=>typeof v!=='object').join(' ')).includes(q);}function render(){renderTabs();const rows=(catalog[currentFacility]&&catalog[currentFacility][currentSection])||[];const branches=currentSection==='branches',scrolls=currentSection==='scrolls',crystal=currentSection==='crystal';$('branchControls').hidden=!branches;$('catalogSearchControls').hidden=branches;renderRankControls(rows,branches);const filtered=branches?rows:rows.filter(rankMatches).filter(catalogRowMatches);if($('catalogSearchCount'))$('catalogSearchCount').textContent=branches?'':`${filtered.length}件表示`;$('cards').className=branches?'':'cards';$('cards').innerHTML=branches?branchCatalog(rows):(filtered.length?(scrolls?filtered.map(scrollPriceCard).join(''):currentSection==='sales'?filtered.map(itemCard).join(''):crystal?filtered.map(crystalCard).join(''):recipeCatalog(filtered)):'<div class="empty">現在の検索・★ランク条件に一致する内容はありません。</div>');;if(branches)focusPendingBranchNode();}
async function loadCatalog(key,save,{force=false}={}){
  setStatus('GitHub共通DBと解放範囲を確認しています。');
  $('applyKey').disabled=true;
  $('reloadDb').disabled=true;
  try{
    try{
      const [commonMaster,unlockState]=await Promise.all([
        fetchGithubCommonMaster({force}),
        loadUnlockState(key)
      ]);
      const built=buildFacilityCatalogFromGithub(commonMaster,unlockState);
      catalog=built.catalog||catalog;
      currentKey=key||'';
      if(save){
        if(currentKey)localStorage.setItem(STORAGE_KEY,currentKey);
        else localStorage.removeItem(STORAGE_KEY);
      }
      setStatus(`現在の解放範囲：${built.areaName||'初期エリア'}まで / GitHub共通DB${built.version?' v'+built.version:''}${commonMaster.versionWarning?'（更新反映待ち）':''}`,commonMaster.versionWarning?'':'ok');if($('unlockSummary'))$('unlockSummary').textContent=`${built.areaName||'初期エリア'}まで`;if($('unlockPanel'))$('unlockPanel').open=false;
      render();
      return true;
    }catch(primaryError){
      console.warn('共通DB方式を利用できないため、従来のGAS施設カタログへ切り替えます。',primaryError);
      const legacy=await loadLegacyCatalog(key);
      catalog=legacy.catalog||catalog;
      currentKey=key||'';
      if(save){
        if(currentKey)localStorage.setItem(STORAGE_KEY,currentKey);
        else localStorage.removeItem(STORAGE_KEY);
      }
      setStatus(`現在の解放範囲：${legacy.areaName||'初期エリア'}まで / GASフォールバック`,'ok');
      render();
      return true;
    }
  }catch(error){
    setStatus(String(error.message||error),'bad');
    return false;
  }finally{
    $('applyKey').disabled=false;
    $('reloadDb').disabled=false;
  }
}

document.addEventListener('click',e=>{

  const r=e.target.closest('[data-rank-filter]');if(r){closeWeaponModal();currentRank=r.dataset.rankFilter||'all';render();return;}
});

const saved=localStorage.getItem(STORAGE_KEY)||'';$('unlockKey').value=saved;loadCatalog(saved,false).then(ok=>{if(!ok&&saved){$('unlockKey').value='';localStorage.removeItem(STORAGE_KEY);loadCatalog('',false);}});
